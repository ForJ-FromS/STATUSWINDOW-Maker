<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Character Profile Maker</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a10;
      --panel: #10131d;
      --panel-2: #151927;
      --line: #2ef2ff;
      --line-soft: rgba(46, 242, 255, .38);
      --text: #f4f8fb;
      --muted: #aab7c2;
      --field: #0b0e16;
      --warn: #f8f0b4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(46, 242, 255, .08), transparent 34%),
        radial-gradient(circle at 82% 20%, rgba(255, 48, 196, .08), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 390px) minmax(360px, 1fr);
      gap: 28px;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
      align-items: start;
    }

    .controls {
      border: 1px solid rgba(255, 255, 255, .08);
      background: rgba(13, 16, 25, .9);
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .controls h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    .controls p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .field {
      display: grid;
      gap: 7px;
      margin-top: 12px;
    }

    .field label {
      color: #d9e9ee;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 6px;
      background: var(--field);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--line);
      box-shadow: 0 0 0 3px rgba(46, 242, 255, .1);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .actions button {
      min-height: 42px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      cursor: pointer;
      color: #061015;
      background: var(--line);
      font-weight: 800;
    }

    .actions button.secondary {
      color: var(--text);
      background: rgba(255, 255, 255, .09);
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .preview-wrap {
      display: grid;
      justify-items: center;
      gap: 14px;
    }

    .stage {
      width: min(420px, 100%);
      aspect-ratio: 9 / 16;
      padding: 12px;
      background: #05070d;
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: 0 28px 110px rgba(0, 0, 0, .48);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(46, 242, 255, .14), transparent 18%),
        radial-gradient(circle at 78% 16%, rgba(46, 242, 255, .16), transparent 20%),
        linear-gradient(140deg, rgba(255, 255, 255, .055), transparent 42%),
        #080b13;
      border: 1px solid var(--line);
      clip-path: polygon(7% 0, 100% 0, 100% 93%, 93% 100%, 0 100%, 0 7%);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid var(--line-soft);
      pointer-events: none;
      clip-path: polygon(6% 0, 100% 0, 100% 94%, 94% 100%, 0 100%, 0 6%);
    }

    .card::after {
      display: none;
    }

    .scan {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.018) 0 1px, transparent 1px 10px);
      opacity: .18;
      pointer-events: none;
    }

    .header {
      position: absolute;
      top: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text);
      font-size: 11px;
      letter-spacing: .18em;
      font-weight: 800;
      z-index: 2;
    }

    .role-mark {
      border: 1px solid var(--line-soft);
      color: var(--line);
      background: rgba(46, 242, 255, .08);
      padding: 6px 9px;
      letter-spacing: .08em;
      font-size: 10px;
    }

    .portrait {
      position: absolute;
      left: 28px;
      right: 28px;
      top: 74px;
      bottom: 198px;
      border: 1px solid rgba(46, 242, 255, .5);
      background:
        linear-gradient(90deg, rgba(46, 242, 255, .14) 1px, transparent 1px),
        linear-gradient(180deg, rgba(46, 242, 255, .1) 1px, transparent 1px),
        rgba(255, 255, 255, .025);
      background-size: 28px 28px;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 38px rgba(46, 242, 255, .07);
    }

    .portrait::before,
    .portrait::after {
      content: "";
      position: absolute;
      width: 46px;
      height: 46px;
      border-color: var(--line);
      opacity: .75;
      pointer-events: none;
    }

    .portrait::before {
      left: 10px;
      top: 10px;
      border-left: 2px solid;
      border-top: 2px solid;
    }

    .portrait::after {
      right: 10px;
      bottom: 10px;
      border-right: 2px solid;
      border-bottom: 2px solid;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(var(--img-x, 0%), var(--img-y, 0%)) scale(var(--img-scale, 1));
      transform-origin: center;
      display: none;
    }

    .empty {
      color: rgba(244, 248, 251, .42);
      font-size: 12px;
      letter-spacing: .22em;
      font-weight: 800;
    }

    .portrait.has-image img {
      display: block;
    }

    .portrait.has-image .empty {
      display: none;
    }

    .name-block {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 132px;
      min-height: 70px;
      padding: 10px 14px 9px 16px;
      border-left: 3px solid var(--line);
      background: linear-gradient(90deg, rgba(46, 242, 255, .14), rgba(7, 10, 17, .3) 70%, transparent);
      text-shadow: 0 0 18px rgba(46, 242, 255, .26);
      z-index: 2;
    }

    .name {
      margin: 0;
      font-size: clamp(36px, 6vw, 50px);
      line-height: .88;
      font-weight: 950;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .quote {
      margin-top: 9px;
      color: #e9faff;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      min-height: 118px;
      padding: 22px 24px 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      background: linear-gradient(180deg, rgba(6, 8, 13, .66), rgba(3, 4, 8, .96));
      border-top: 1px solid rgba(46, 242, 255, .42);
    }

    .bottom::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 21px;
      bottom: 19px;
      width: 1px;
      background: rgba(46, 242, 255, .24);
    }

    .info-label {
      color: rgba(244, 248, 251, .52);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
    }

    .info-value {
      margin-top: 9px;
      color: var(--text);
      font-size: 16px;
      font-weight: 900;
      line-height: 1.25;
    }

    .badge {
      position: absolute;
      right: 38px;
      top: 88px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, .82);
      font-size: 25px;
      font-weight: 950;
      text-shadow: 0 0 18px rgba(46, 242, 255, .55);
      z-index: 3;
    }

    .badge::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 12, .76);
      border: 1px solid var(--line);
      box-shadow: 0 0 20px rgba(46, 242, 255, .25);
      clip-path: polygon(18% 0, 100% 0, 100% 82%, 82% 100%, 0 100%, 0 18%);
    }

    .badge span {
      position: relative;
    }

    .role-ornament {
      display: none;
    }

    .hint {
      max-width: 470px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      .stage {
        max-width: 430px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="controls" aria-label="프로필 설정">
      <h1>캐릭터 설명창 메이커</h1>
      <p>인물 이미지를 넣거나 비워둔 채로 센티넬/가이드 프로필 창을 만들 수 있어요.</p>

      <div class="row">
        <div class="field">
          <label for="role">Role</label>
          <select id="role">
            <option value="sentinel">SENTINEL</option>
            <option value="guide">GUIDE</option>
          </select>
        </div>
        <div class="field">
          <label for="classText">Class</label>
          <input id="classText" value="CLASS-A">
        </div>
      </div>

      <div class="field">
        <label for="nameText">Name</label>
        <input id="nameText" value="NAME">
      </div>

      <div class="field">
        <label for="quoteText">Quote</label>
        <input id="quoteText" value="“대사 한 줄”">
      </div>

      <div class="row">
        <div class="field">
          <label for="abilityText">Ability</label>
          <input id="abilityText" value="[능력]">
        </div>
        <div class="field">
          <label for="affiliationText">Affiliation</label>
          <input id="affiliationText" value="Fearless HQ">
        </div>
      </div>

      <div class="field">
        <label for="imageInput">Character Image</label>
        <input id="imageInput" type="file" accept="image/*">
      </div>

      <div class="row">
        <div class="field">
          <label for="imageScale">Image Zoom</label>
          <input id="imageScale" type="range" min="1" max="2.2" step="0.01" value="1">
        </div>
        <div class="field">
          <label for="imageX">Image X</label>
          <input id="imageX" type="range" min="-35" max="35" step="1" value="0">
        </div>
      </div>

      <div class="field">
        <label for="imageY">Image Y</label>
        <input id="imageY" type="range" min="-35" max="35" step="1" value="0">
      </div>

      <div class="actions">
        <button id="downloadBtn" type="button">PNG 저장</button>
        <button class="secondary" id="resetImageBtn" type="button">위치 초기화</button>
        <button class="secondary" id="clearBtn" type="button">이미지 비우기</button>
      </div>
    </section>

    <section class="preview-wrap" aria-label="미리보기">
      <div class="stage">
        <article id="card" class="card">
          <div class="scan"></div>
          <div class="role-ornament" aria-hidden="true"></div>
          <div class="header">
            <span id="roleTitle">SENTINEL // CLASS-A</span>
            <span class="role-mark" id="idText">ID 001</span>
          </div>

          <div id="portrait" class="portrait">
            <img id="portraitImg" alt="">
            <span class="empty">IMAGE SLOT</span>
          </div>

          <div class="name-block">
            <h2 class="name" id="displayName">NAME</h2>
            <div class="quote" id="displayQuote">“대사 한 줄”</div>
          </div>

          <div class="bottom">
            <div>
              <div class="info-label">ABILITY</div>
              <div class="info-value" id="displayAbility">[능력]</div>
            </div>
            <div>
              <div class="info-label">AFFILIATION</div>
              <div class="info-value" id="displayAffiliation">Fearless HQ</div>
            </div>
          </div>

          <div class="badge" aria-hidden="true"><span id="badgeText">S</span></div>
        </article>
      </div>
      <div class="hint">하단 정보는 원본처럼 간단하게 두었고, 역할에 따라 상단 라벨과 색만 바뀌어요.</div>
    </section>
  </main>

  <script>
    const role = document.querySelector("#role");
    const classText = document.querySelector("#classText");
    const nameText = document.querySelector("#nameText");
    const quoteText = document.querySelector("#quoteText");
    const abilityText = document.querySelector("#abilityText");
    const affiliationText = document.querySelector("#affiliationText");
    const imageInput = document.querySelector("#imageInput");
    const imageScale = document.querySelector("#imageScale");
    const imageX = document.querySelector("#imageX");
    const imageY = document.querySelector("#imageY");
    const card = document.querySelector("#card");
    const roleTitle = document.querySelector("#roleTitle");
    const idText = document.querySelector("#idText");
    const displayName = document.querySelector("#displayName");
    const displayQuote = document.querySelector("#displayQuote");
    const displayAbility = document.querySelector("#displayAbility");
    const displayAffiliation = document.querySelector("#displayAffiliation");
    const badgeText = document.querySelector("#badgeText");
    const portrait = document.querySelector("#portrait");
    const portraitImg = document.querySelector("#portraitImg");
    const clean = (value, fallback) => value.trim() || fallback;

    function renderImageTransform() {
      portraitImg.style.setProperty("--img-scale", imageScale.value);
      portraitImg.style.setProperty("--img-x", `${imageX.value}%`);
      portraitImg.style.setProperty("--img-y", `${imageY.value}%`);
    }

    function render() {
      const selected = role.value;
      const roleName = selected === "guide" ? "GUIDE" : "SENTINEL";
      const className = clean(classText.value, "CLASS-A");

      card.classList.toggle("guide", selected === "guide");
      roleTitle.textContent = `${roleName} // ${className}`;
      idText.textContent = selected === "guide" ? "ID G01" : "ID S01";
      badgeText.textContent = selected === "guide" ? "G" : "S";
      displayName.textContent = clean(nameText.value, "NAME");
      displayQuote.textContent = clean(quoteText.value, "“대사 한 줄”");
      displayAbility.textContent = clean(abilityText.value, "[능력]");
      displayAffiliation.textContent = clean(affiliationText.value, "Fearless HQ");
    }

    [role, classText, nameText, quoteText, abilityText, affiliationText].forEach((item) => {
      item.addEventListener("input", render);
    });

    [imageScale, imageX, imageY].forEach((item) => {
      item.addEventListener("input", renderImageTransform);
    });

    imageInput.addEventListener("change", () => {
      const file = imageInput.files && imageInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        portraitImg.src = reader.result;
        portrait.classList.add("has-image");
      };
      reader.readAsDataURL(file);
    });

    document.querySelector("#clearBtn").addEventListener("click", () => {
      imageInput.value = "";
      portraitImg.removeAttribute("src");
      portrait.classList.remove("has-image");
    });

    document.querySelector("#resetImageBtn").addEventListener("click", () => {
      imageScale.value = 1;
      imageX.value = 0;
      imageY.value = 0;
      renderImageTransform();
    });

    document.querySelector("#downloadBtn").addEventListener("click", async () => {
      await exportCard();
    });

    async function exportCard() {
      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext("2d");
      await drawExportCard(ctx, canvas.width, canvas.height);
      const link = document.createElement("a");
      link.download = `${clean(nameText.value, "character")}-${role.value}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    async function drawExportCard(ctx, w, h) {
      const line = "#2ef2ff";
      const lineSoft = "rgba(46,242,255,.5)";
      const cardBox = card.getBoundingClientRect();
      const scaleX = w / cardBox.width;
      const scaleY = h / cardBox.height;
      const mapRect = (element) => {
        const box = element.getBoundingClientRect();
        return {
          x: (box.left - cardBox.left) * scaleX,
          y: (box.top - cardBox.top) * scaleY,
          w: box.width * scaleX,
          h: box.height * scaleY,
        };
      };

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#05070d";
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      angledRect(ctx, 16, 16, w - 32, h - 32, 76);
      ctx.clip();
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, "#132a32");
      bg.addColorStop(.34, "#080b13");
      bg.addColorStop(1, "#03050a");
      ctx.fillStyle = bg;
      ctx.fillRect(16, 16, w - 32, h - 32);
      ctx.restore();

      ctx.lineWidth = 4;
      ctx.strokeStyle = line;
      angledRect(ctx, 16, 16, w - 32, h - 32, 76);
      ctx.stroke();
      ctx.lineWidth = 2;
      ctx.strokeStyle = lineSoft;
      angledRect(ctx, 44, 44, w - 88, h - 88, 58);
      ctx.stroke();

      const headerText = mapRect(roleTitle);
      const idBox = mapRect(idText.parentElement);
      const idLabel = mapRect(idText);
      ctx.fillStyle = "#f4f8fb";
      setCanvasFont(ctx, roleTitle, scaleY, 900);
      ctx.fillText(roleTitle.textContent, headerText.x, headerText.y + headerText.h * .82);
      ctx.strokeStyle = lineSoft;
      ctx.lineWidth = 2;
      ctx.strokeRect(idBox.x, idBox.y, idBox.w, idBox.h);
      ctx.fillStyle = line;
      setCanvasFont(ctx, idText, scaleY, 900);
      ctx.fillText(idText.textContent, idLabel.x, idLabel.y + idLabel.h * .82);

      const portraitBox = mapRect(portrait);
      drawPortraitSlot(ctx, portraitBox.x, portraitBox.y, portraitBox.w, portraitBox.h, line, lineSoft);

      if (portrait.classList.contains("has-image") && portraitImg.complete && portraitImg.naturalWidth) {
        drawAdjustedImage(ctx, portraitImg, portraitBox.x, portraitBox.y, portraitBox.w, portraitBox.h);
      } else {
        ctx.fillStyle = "rgba(244,248,251,.42)";
        ctx.font = `${900} ${Math.round(12 * scaleY)}px system-ui, -apple-system, sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("IMAGE SLOT", portraitBox.x + portraitBox.w / 2, portraitBox.y + portraitBox.h / 2);
        ctx.textAlign = "left";
      }

      drawPortraitCorners(ctx, portraitBox.x, portraitBox.y, portraitBox.w, portraitBox.h, line, scaleX);

      const badgeBox = mapRect(document.querySelector(".badge"));
      drawBadge(ctx, badgeBox, line, scaleY);

      const nameBox = mapRect(document.querySelector(".name-block"));
      ctx.fillStyle = "rgba(46,242,255,.14)";
      ctx.fillRect(nameBox.x, nameBox.y, nameBox.w, nameBox.h);
      ctx.fillStyle = line;
      ctx.fillRect(nameBox.x, nameBox.y, Math.max(6, 3 * scaleX), nameBox.h);

      const nameRect = mapRect(displayName);
      ctx.fillStyle = "#f4f8fb";
      setCanvasFont(ctx, displayName, scaleY, 950);
      fitText(ctx, displayName.textContent.toUpperCase(), nameRect.x, nameRect.y + nameRect.h * .84, nameBox.w * .58, parseFloat(getComputedStyle(displayName).fontSize) * scaleY, 32 * scaleY);

      const quoteRect = mapRect(displayQuote);
      ctx.fillStyle = "#e9faff";
      setCanvasFont(ctx, displayQuote, scaleY, 800);
      ctx.textAlign = "right";
      ctx.fillText(displayQuote.textContent, quoteRect.x + quoteRect.w, quoteRect.y + quoteRect.h * .82);
      ctx.textAlign = "left";

      const bottomBox = mapRect(document.querySelector(".bottom"));
      const grd = ctx.createLinearGradient(0, bottomBox.y, 0, bottomBox.y + bottomBox.h);
      grd.addColorStop(0, "rgba(6,8,13,.78)");
      grd.addColorStop(1, "rgba(3,4,8,.98)");
      ctx.fillStyle = grd;
      ctx.fillRect(bottomBox.x, bottomBox.y, bottomBox.w, bottomBox.h);
      ctx.strokeStyle = lineSoft;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bottomBox.x, bottomBox.y);
      ctx.lineTo(bottomBox.x + bottomBox.w, bottomBox.y);
      ctx.moveTo(w / 2, bottomBox.y + 21 * scaleY);
      ctx.lineTo(w / 2, bottomBox.y + bottomBox.h - 19 * scaleY);
      ctx.stroke();

      const labels = document.querySelectorAll(".info-label");
      const values = document.querySelectorAll(".info-value");
      exportInfoBlock(ctx, labels[0], values[0], scaleY);
      exportInfoBlock(ctx, labels[1], values[1], scaleY);
    }

    function drawPortraitSlot(ctx, x, y, w, h, line, lineSoft) {
      ctx.fillStyle = "rgba(255,255,255,.025)";
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = lineSoft;
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.strokeStyle = "rgba(46,242,255,.18)";
      ctx.lineWidth = 1;
      for (let gx = x; gx <= x + w; gx += 72) {
        ctx.beginPath();
        ctx.moveTo(gx, y);
        ctx.lineTo(gx, y + h);
        ctx.stroke();
      }
      for (let gy = y; gy <= y + h; gy += 72) {
        ctx.beginPath();
        ctx.moveTo(x, gy);
        ctx.lineTo(x + w, gy);
        ctx.stroke();
      }
    }

    function drawAdjustedImage(ctx, img, x, y, w, h) {
      const zoom = Number(imageScale.value) || 1;
      const offsetX = Number(imageX.value) || 0;
      const offsetY = Number(imageY.value) || 0;
      const ratio = Math.max(w / img.naturalWidth, h / img.naturalHeight) * zoom;
      const dw = img.naturalWidth * ratio;
      const dh = img.naturalHeight * ratio;
      const dx = x + (w - dw) / 2 + (offsetX / 100) * w;
      const dy = y + (h - dh) / 2 + (offsetY / 100) * h;

      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
    }

    function drawPortraitCorners(ctx, x, y, w, h, line, scaleX) {
      const inset = 10 * scaleX;
      const long = 46 * scaleX;
      ctx.strokeStyle = line;
      ctx.lineWidth = Math.max(3, 2 * scaleX);
      ctx.beginPath();
      ctx.moveTo(x + inset, y + inset + long);
      ctx.lineTo(x + inset, y + inset);
      ctx.lineTo(x + inset + long, y + inset);
      ctx.moveTo(x + w - inset, y + h - inset - long);
      ctx.lineTo(x + w - inset, y + h - inset);
      ctx.lineTo(x + w - inset - long, y + h - inset);
      ctx.stroke();
    }

    function drawBadge(ctx, box, line, scaleY) {
      ctx.fillStyle = "rgba(3,7,12,.78)";
      angledRect(ctx, box.x, box.y, box.w, box.h, Math.min(box.w, box.h) * .18);
      ctx.fill();
      ctx.strokeStyle = line;
      ctx.lineWidth = Math.max(3, 1.5 * scaleY);
      angledRect(ctx, box.x, box.y, box.w, box.h, Math.min(box.w, box.h) * .18);
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.86)";
      setCanvasFont(ctx, badgeText, scaleY, 950);
      ctx.textAlign = "center";
      ctx.fillText(badgeText.textContent, box.x + box.w / 2, box.y + box.h * .68);
      ctx.textAlign = "left";
    }

    function exportInfoBlock(ctx, labelElement, valueElement, scaleY) {
      const cardBox = card.getBoundingClientRect();
      const canvasScaleX = 1080 / cardBox.width;
      const canvasScaleY = 1920 / cardBox.height;
      const mapRect = (element) => {
        const box = element.getBoundingClientRect();
        return {
          x: (box.left - cardBox.left) * canvasScaleX,
          y: (box.top - cardBox.top) * canvasScaleY,
          w: box.width * canvasScaleX,
          h: box.height * canvasScaleY,
        };
      };
      const label = mapRect(labelElement);
      const value = mapRect(valueElement);
      ctx.fillStyle = "rgba(244,248,251,.58)";
      setCanvasFont(ctx, labelElement, scaleY, 900);
      ctx.fillText(labelElement.textContent, label.x, label.y + label.h * .82);
      ctx.fillStyle = "#f4f8fb";
      setCanvasFont(ctx, valueElement, scaleY, 950);
      wrapCanvasText(ctx, valueElement.textContent, value.x, value.y + value.h * .78, value.w, value.h * .88);
    }

    function fitText(ctx, text, x, y, maxWidth, startSize = 110, minSize = 54) {
      let size = startSize;
      while (ctx.measureText(text).width > maxWidth && size > minSize) {
        size -= 4;
        ctx.font = `950 ${size}px system-ui, -apple-system, sans-serif`;
      }
      ctx.fillText(text, x, y);
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = String(text).split(/\s+/);
      let line = "";
      for (const word of words) {
        const test = line ? `${line} ${word}` : word;
        if (ctx.measureText(test).width > maxWidth && line) {
          ctx.fillText(line, x, y);
          line = word;
          y += lineHeight;
        } else {
          line = test;
        }
      }
      ctx.fillText(line, x, y);
    }

    function setCanvasFont(ctx, element, scaleY, fallbackWeight) {
      const style = getComputedStyle(element);
      const size = parseFloat(style.fontSize) * scaleY;
      const weight = Number.parseInt(style.fontWeight, 10) || fallbackWeight;
      ctx.font = `${weight} ${size}px system-ui, -apple-system, sans-serif`;
    }

    function angledRect(ctx, x, y, w, h, cut) {
      ctx.beginPath();
      ctx.moveTo(x + cut, y);
      ctx.lineTo(x + w, y);
      ctx.lineTo(x + w, y + h - cut);
      ctx.lineTo(x + w - cut, y + h);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x, y + cut);
      ctx.closePath();
    }

    render();
    renderImageTransform();
  </script>
</body>
